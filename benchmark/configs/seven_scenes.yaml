# 7Scenes — lingbot_map trajectory + AUC + point-cloud evaluation.
# Stride-5 sampling; see configs/datasets/seven_scenes.yaml.
# Layout moved 2026-08-20 to campaigns/<campaign>/<arm>/<benchmark>, and the
# duplicated dataset level was flattened away, so the ARM dir is now the
# workspace root and `datasets:` below selects the subdir under it. One root
# therefore serves every dataset sharing that arm.
workspace: /group/compact-3dmem/campaigns/lingbot_map/default

datasets:
  - seven_scenes

methods:
  - lingbot_map

evaluation:
  traj:
    enable: true
    vis: true
  auc:
    enable: true
    vis: true
    aggregation: both
  depth:
    enable: false
  points:
    enable: true
    vis: false
    icp_threshold: 0.1
    conf_threshold: 0.0
