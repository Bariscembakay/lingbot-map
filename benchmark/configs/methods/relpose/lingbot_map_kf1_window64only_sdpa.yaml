model: lingbot_map
env: lingbot_map
_checkpoint: /home/baris_bakay/lingbot-map/ckpt/lingbot-map.pt
_device: cuda
_mode: streaming
_use_amp: true
_use_sdpa: true   # SDPA only: FlashInfer ignores the cache-composition knobs
_image_size: 518
_patch_size: 14
_enable_3d_rope: true
_num_scale_frames: 8
_max_frame_num: 20480          # MUST exceed the frame count (every frame is a keyframe): 3D RoPE precomputes this many rows
_kv_cache_sliding_window: 64
_kv_cache_scale_frames: 8
_keyframe_interval: 1            # every frame cached, as in the training caches (cache1048)
_auto_keyframe_threshold: 320    # frame-count threshold driving the 'auto' keyframe_interval (streaming mode)
_area_budget: 255000
_align: 14

# Context = the last 64 frames only: no anchor frames, no trajectory memory of evicted frames.
_kv_cache_include_scale_frames: false
_kv_cache_cross_frame_special: false
