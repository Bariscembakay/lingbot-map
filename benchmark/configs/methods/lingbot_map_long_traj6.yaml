model: lingbot_map
env: lingbot_map
_checkpoint: /home/baris_bakay/lingbot-map/ckpt/lingbot-map.pt
_device: cuda
_mode: streaming
_use_amp: true
_use_sdpa: true   # SDPA only: FlashInfer ignores the cache-composition knobs
_image_size: 518
_patch_size: 14
_enable_3d_rope: true
_num_scale_frames: 8
_max_frame_num: 4096            # MUST exceed the keyframe count: 3D RoPE precomputes freqs to exactly this many rows
_kv_cache_sliding_window: 64
_kv_cache_scale_frames: 8
_keyframe_interval: 1            # explicit, NOT auto: auto would give ceil(3840/320)=12 and subsample back to ~320 keyframes, defeating the test
_auto_keyframe_threshold: 320    # frame-count threshold driving the 'auto' keyframe_interval (streaming mode)
_area_budget: 255000
_align: 14

# Control: all 6 context tokens.
_kv_cache_memory_tokens: "camera,register,scale"
