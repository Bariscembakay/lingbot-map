model: lingbot_map
env: lingbot_map
_checkpoint: /home/baris_bakay/lingbot-map/ckpt/lingbot-map.pt
_device: cuda
_mode: streaming
_use_amp: true
_use_sdpa: true
_image_size: 518
_patch_size: 14
_enable_3d_rope: true
_num_scale_frames: 2
_max_frame_num: 1024
_kv_cache_sliding_window: 4
_kv_cache_scale_frames: 2
_keyframe_interval: auto         # auto = 1 if frames<=threshold else ceil(N/threshold); or a fixed int
_auto_keyframe_threshold: 320    # frame-count threshold driving the 'auto' keyframe_interval (streaming mode)
_area_budget: 255000
_align: 14

# Trajectory-memory stress test: anchor 2 + window 4 shrinks the resident
# store so the memory is a much larger share of visible context.
_kv_cache_memory_tokens: "camera,scale"
