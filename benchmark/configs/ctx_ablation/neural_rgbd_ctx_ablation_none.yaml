# Final row of the context-token ablation: trajectory memory removed entirely.
# Same workspace as the other arms so it lands in the same eval/*.json. Kept in its
# own config because evaluate.py scores every method a config lists, and re-scoring
# the finished arms would cost hours of ICP for numbers that already exist.
workspace: /group/compact-3dmem/campaigns/lingbot_map/context_token_ablation

datasets:
  - neural_rgbd

methods:
  - lingbot_map_traj_none
evaluation:
  traj:
    enable: false
  auc:
    enable: false
  depth:
    enable: false
  points:
    enable: true
    vis: true          # keep the clouds: writes gt/pred colored PLYs + PR curves
    icp_threshold: 0.1
