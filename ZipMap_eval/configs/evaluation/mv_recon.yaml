# @package _global_

defaults:
  - override /data: mv_recon

name: mv_recon

eval_models:
  # LOCAL PATCH (lingbot-map): only the recall-benchmark baselines; pi3/vggt
  # rows are not reproduction targets here.
  - ZipMap
  - ttt3r
  - cut3r

eval_datasets:
  # LOCAL PATCH (lingbot-map): paper Table 3 = 7-Scenes + NRGBD, both settings.
  - 7scenes-sparse
  - 7scenes-dense
  - NRGBD-sparse
  - NRGBD-dense


no_crop: True
load_img_size: 518

device: cuda

verbose: False

seed: 42

save_suffix: null
